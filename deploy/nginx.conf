server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Game Hub embeds this build in an iframe; its window runs with
    # Cross-Origin-Embedder-Policy: credentialless, so the framed document
    # opts in too. (add_header in a location replaces these, hence repeated.)
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # The card art Game Hub's Prototypes page shows.
    location = /game-hub-card.webp {
        add_header Cache-Control "public, max-age=3600";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
